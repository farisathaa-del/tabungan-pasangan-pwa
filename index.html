<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tabungan Faris & Saiba</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabungan">
  <meta name="theme-color" content="#FAFAFC">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    /* ponytail: 100dvh only — -webkit-fill-available shrinks the iframe under
           black-translucent and leaves a black band above the home indicator */
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          background: #000000;
          overflow: hidden;
          overscroll-behavior: none;
          touch-action: manipulation;
          -webkit-text-size-adjust: 100%;
        }
        iframe {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100dvh;
          border: 0;
          display: block;
          background: #000000;
        }
  </style>
</head>
<body>
  <!-- ponytail: full bleed iOS standalone wrapper; safe area handled inside GAS -->
  <iframe src="https://script.google.com/macros/s/AKfycbzFL7OpHVTdM2JBaZtQrwsSQ6f1V6mqCaLCBe92uP9LJPIObS_0vWxVVB_d_qsD6zbD/exec?v=12"
          allow="clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <script>
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
    });
  </script>
</body>
</html>
